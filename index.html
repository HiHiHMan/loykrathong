
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d19">
  <title>Your Moment | ลอยกระทงออนไลน์</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="landing">
    <div class="moon-glow"></div>
    <div class="water"></div>

    <section class="content">
      <p class="eyebrow">YOUR MOMENT <span>·</span> 01</p>

      <h1>คืนความสุข<br>ให้สายน้ำ</h1>

      <p class="description">
        บางความรู้สึกเหมาะกับการฝากไว้กับสายน้ำ<br>
        เลือกกระทงที่เป็นคุณ แล้วส่งคำอธิษฐานออกไป
      </p>

      <div class="section-label">
        <span></span>
        <p>CHOOSE YOUR KRATHONG</p>
        <span></span>
      </div>

      <div class="krathong-list">
        <button class="krathong selected" type="button"
          data-flower="lotus" aria-pressed="true">
          <span class="krathong-art lotus" aria-hidden="true">🪷</span>
          <span class="krathong-name">บัวชมพู</span>
          <span class="krathong-detail">ความรักและความหวัง</span>
        </button>

        <button class="krathong" type="button"
          data-flower="marigold" aria-pressed="false">
          <span class="krathong-art marigold" aria-hidden="true">🌼</span>
          <span class="krathong-name">ดาวเรืองทอง</span>
          <span class="krathong-detail">โชคดีและความสำเร็จ</span>
        </button>

        <button class="krathong" type="button"
          data-flower="banana" aria-pressed="false">
          <span class="krathong-art banana" aria-hidden="true">🍃</span>
          <span class="krathong-name">ใบตองธรรมชาติ</span>
          <span class="krathong-detail">เริ่มต้นใหม่อย่างสงบ</span>
        </button>
      </div>

      <button class="start-button" id="start-button" type="button">
        เริ่มสร้างกระทงของคุณ <span aria-hidden="true">↗</span>
      </button>

      <p class="hint" id="status" aria-live="polite">
        เลือกกระทงที่ตรงกับความรู้สึกของคุณ
      </p>
    </section>

    <footer>
      <span>MADE WITH A WISH</span>
      <span>LOY KRATHONG · THAILAND</span>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
