<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d19">
  <title>จัดการคำอธิษฐาน | Loy Krathong</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--bg:#080d19;--panel:rgba(17,25,43,.88);--line:rgba(221,190,117,.2);--gold:#d9b86c;--muted:#9aa6ba;--text:#f3f0e8;--danger:#e47d7d}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -15%,#25334a 0%,#101a2b 42%,var(--bg) 78%);color:var(--text);font-family:Kanit,sans-serif;font-weight:300}
    button,input,textarea,select{font:inherit}
    .page{width:min(1180px,calc(100% - 36px));margin:0 auto;padding:42px 0 64px}
    .top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:30px}
    .eyebrow{color:var(--gold);letter-spacing:.16em;font:12px 'Playfair Display',serif;text-transform:uppercase}
    h1{font-size:clamp(25px,4vw,38px);font-weight:400;margin:7px 0 4px}
    .subtitle{color:var(--muted);font-size:14px}
    .back{color:var(--gold);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:9px 17px;white-space:nowrap}
    .back:hover{background:rgba(217,184,108,.1)}
    .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:20px}
    .stat,.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 55px rgba(0,0,0,.16)}
    .stat{padding:17px 20px}.stat-label{color:var(--muted);font-size:13px}.stat-value{font-size:27px;color:var(--gold);font-weight:500}
    .panel{padding:22px}
    .toolbar{display:flex;gap:12px;align-items:center;margin-bottom:18px}
    .search{flex:1;min-width:0}
    input,textarea,select{width:100%;color:var(--text);background:#0c1423;border:1px solid rgba(180,194,215,.2);border-radius:10px;padding:11px 13px;outline:none}
    input:focus,textarea:focus,select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(217,184,108,.1)}
    .btn{border:1px solid var(--line);border-radius:10px;padding:10px 16px;color:var(--text);background:rgba(217,184,108,.1);cursor:pointer;white-space:nowrap}
    .btn:hover{background:rgba(217,184,108,.2)}.btn:disabled{opacity:.5;cursor:wait}
    .btn-danger{color:#ffc1c1;border-color:rgba(228,125,125,.35);background:rgba(228,125,125,.08)}
    .table-wrap{overflow-x:auto}
    table{width:100%;border-collapse:collapse;min-width:760px}
    th,td{text-align:left;padding:13px 12px;border-bottom:1px solid rgba(180,194,215,.12);vertical-align:middle}
    th{font-size:12px;color:var(--gold);font-weight:400;white-space:nowrap}
    td{font-size:14px}
    .name{font-weight:400}.sub{display:block;color:var(--muted);font-size:12px}
    .wish-text{max-width:360px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#d9dce3}
    .actions{display:flex;gap:7px}.actions .btn{padding:7px 11px;font-size:12px}
    .empty,.status{padding:28px;text-align:center;color:var(--muted)}
    .status.error{color:#ffaaaa}
    .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:18px;z-index:10}
    .modal-backdrop.open{display:flex}
    .modal{width:min(650px,100%);max-height:90vh;overflow:auto;background:#101a2b;border:1px solid var(--line);border-radius:18px;padding:23px;box-shadow:0 25px 90px #0009}
    .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
    .modal h2{font-weight:400;font-size:21px;margin:0}.close{border:0;background:none;color:var(--muted);font-size:25px;cursor:pointer}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
    .field{display:flex;flex-direction:column;gap:6px}.field label{font-size:13px;color:#c5cbd5}.field.full{grid-column:1/-1}
    textarea{resize:vertical;min-height:100px}
    .modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}
    @media(max-width:640px){.page{width:min(100% - 24px,1180px);padding-top:26px}.top{align-items:flex-start}.back{font-size:12px;padding:8px 12px}.stats{gap:8px}.stat{padding:12px}.stat-value{font-size:22px}.stat-label{font-size:11px}.panel{padding:14px}.toolbar{align-items:stretch;flex-direction:column}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
  </style>
</head>
<body>
  <main class="page">
    <header class="top">
      <div>
        <div class="eyebrow">Loy Krathong · Admin</div>
        <h1>จัดการคำอธิษฐาน</h1>
        <div class="subtitle">ตรวจสอบ แก้ไข และลบข้อมูล Wishes</div>
      </div>
      <a class="back" href="./index.html">← กลับหน้าหลัก</a>
    </header>

    <section class="stats" aria-label="สรุปข้อมูล">
      <div class="stat"><div class="stat-label">คำอธิษฐานทั้งหมด</div><div class="stat-value" id="totalCount">—</div></div>
      <div class="stat"><div class="stat-label">ผลการค้นหา</div><div class="stat-value" id="filteredCount">—</div></div>
      <div class="stat"><div class="stat-label">การเชื่อมต่อ</div><div class="stat-value" id="connectionState" style="font-size:17px">กำลังเชื่อมต่อ</div></div>
    </section>

    <section class="panel">
      <div class="toolbar">
        <input class="search" id="searchInput" type="search" placeholder="ค้นหาชื่อ รหัสพนักงาน แผนก หรือคำอธิษฐาน...">
        <button class="btn" id="refreshButton" type="button">↻ โหลดข้อมูลใหม่</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>ผู้ส่งคำอธิษฐาน</th><th>แผนก / คลัง</th><th>คำอธิษฐาน</th><th>ประเภทกระทง</th><th>วันที่</th><th>จัดการ</th></tr></thead>
          <tbody id="wishesTable"><tr><td colspan="6" class="empty">กำลังโหลดข้อมูล...</td></tr></tbody>
        </table>
      </div>
      <div class="status" id="pageStatus" role="status"></div>
    </section>
  </main>

  <div class="modal-backdrop" id="editBackdrop" aria-hidden="true">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head"><h2 id="modalTitle">แก้ไขคำอธิษฐาน</h2><button class="close" id="closeModal" type="button" aria-label="ปิด">×</button></div>
      <form id="editForm">
        <input type="hidden" id="editId">
        <div class="form-grid">
          <div class="field"><label for="editName">ชื่อ - นามสกุล</label><input id="editName" required maxlength="120"></div>
          <div class="field"><label for="editCode">รหัสพนักงาน</label><input id="editCode" maxlength="50"></div>
          <div class="field"><label for="editDepartment">แผนก</label><input id="editDepartment" maxlength="120"></div>
          <div class="field"><label for="editWarehouse">คลัง / สถานที่</label><input id="editWarehouse" maxlength="120"></div>
          <div class="field full"><label for="editType">ประเภทกระทง</label>
            <select id="editType">
              <option value="lotus">ดอกบัว</option><option value="orchid">ดอกกล้วยไม้</option>
              <option value="marigold">ดอกดาวเรือง</option><option value="globeamaranth">ดอกบานไม่รู้โรย</option>
              <option value="ixora">ดอกเข็ม</option><option value="whitechampaca">ดอกจำปี</option>
              <option value="banana">กระทงใบตอง</option><option value="bread">กระทงขนมปัง</option>
              <option value="coconut">กระทงกะลามะพร้าว</option><option value="flower">กระทงดอกไม้</option>
            </select>
          </div>
          <div class="field full"><label for="editWish">คำอธิษฐาน</label><textarea id="editWish" required maxlength="1000"></textarea></div>
        </div>
        <div class="modal-actions"><button class="btn" id="cancelEdit" type="button">ยกเลิก</button><button class="btn" id="saveEdit" type="submit">บันทึกการแก้ไข</button></div>
      </form>
    </section>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="./js/firebase.js"></script>
  <script>
    "use strict";
    const tableBody = document.getElementById("wishesTable");
    const searchInput = document.getElementById("searchInput");
    const pageStatus = document.getElementById("pageStatus");
    const backdrop = document.getElementById("editBackdrop");
    let allWishes = [];

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      })[char]);
    }
    function formatDate(value) {
      const date = new Date(Number(value || 0));
      if (!Number.isFinite(date.getTime()) || !value) return "—";
      return new Intl.DateTimeFormat("th-TH", {dateStyle:"medium",timeStyle:"short"}).format(date);
    }
    function renderRows() {
      const keyword = searchInput.value.trim().toLocaleLowerCase();
      const rows = allWishes.filter(item => [
        item.fullName,item.employeeCode,item.department,item.whName,item.wish,item.krathongType
      ].some(value => String(value || "").toLocaleLowerCase().includes(keyword)));
      document.getElementById("totalCount").textContent = allWishes.length.toLocaleString("th-TH");
      document.getElementById("filteredCount").textContent = rows.length.toLocaleString("th-TH");
      if (!rows.length) {
        tableBody.innerHTML = '<tr><td colspan="6" class="empty">ไม่พบข้อมูลคำอธิษฐาน</td></tr>';
        return;
      }
      tableBody.innerHTML = rows.map(item => `
        <tr>
          <td><span class="name">${escapeHtml(item.fullName || "ไม่ระบุชื่อ")}</span><span class="sub">${escapeHtml(item.employeeCode || "ไม่มีรหัสพนักงาน")}</span></td>
          <td>${escapeHtml(item.department || "—")}<span class="sub">${escapeHtml(item.whName || "")}</span></td>
          <td><div class="wish-text" title="${escapeHtml(item.wish || "")}">${escapeHtml(item.wish || "—")}</div></td>
          <td>${escapeHtml(item.krathongType || "—")}</td>
          <td><span class="sub">${escapeHtml(formatDate(item.createdAt))}</span></td>
          <td><div class="actions">
            <button class="btn" type="button" data-action="edit" data-id="${escapeHtml(item.id)}">แก้ไข</button>
            <button class="btn btn-danger" type="button" data-action="delete" data-id="${escapeHtml(item.id)}">ลบ</button>
          </div></td>
        </tr>`).join("");
    }
    async function loadWishes() {
      const button = document.getElementById("refreshButton");
      button.disabled = true;
      pageStatus.className = "status";
      pageStatus.textContent = "กำลังโหลดข้อมูล...";
      try {
        if (!window.LoyKrathongDB) throw new Error("Firebase ไม่พร้อมใช้งาน กรุณาตรวจสอบการเชื่อมต่อ");
        allWishes = await window.LoyKrathongDB.getWishes();
        document.getElementById("connectionState").textContent = window.LoyKrathongDB.mode === "mock" ? "จำลอง" : "เชื่อมต่อแล้ว";
        renderRows();
        pageStatus.textContent = allWishes.length ? "" : "ยังไม่มีข้อมูลคำอธิษฐาน";
      } catch (error) {
        console.error(error);
        pageStatus.className = "status error";
        pageStatus.textContent = "โหลดข้อมูลไม่สำเร็จ: " + (error.message || "เกิดข้อผิดพลาด");
        tableBody.innerHTML = '<tr><td colspan="6" class="empty">ไม่สามารถโหลดข้อมูลได้</td></tr>';
        document.getElementById("connectionState").textContent = "ผิดพลาด";
      } finally {
        button.disabled = false;
      }
    }
    function closeEditor() {
      backdrop.classList.remove("open");
      backdrop.setAttribute("aria-hidden","true");
    }
    function openEditor(id) {
      const item = allWishes.find(wish => wish.id === id);
      if (!item) return;
      document.getElementById("editId").value = item.id;
      document.getElementById("editName").value = item.fullName || "";
      document.getElementById("editCode").value = item.employeeCode || "";
      document.getElementById("editDepartment").value = item.department || "";
      document.getElementById("editWarehouse").value = item.whName || "";
      document.getElementById("editType").value = item.krathongType || "lotus";
      document.getElementById("editWish").value = item.wish || "";
      backdrop.classList.add("open");
      backdrop.setAttribute("aria-hidden","false");
      document.getElementById("editName").focus();
    }

    tableBody.addEventListener("click", async event => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;
      const id = button.dataset.id;
      if (button.dataset.action === "edit") {
        openEditor(id);
        return;
      }
      const item = allWishes.find(wish => wish.id === id);
      if (!item || !window.confirm(`ยืนยันลบคำอธิษฐานของ "${item.fullName || "ไม่ระบุชื่อ"}" ใช่หรือไม่?\nการลบนี้ไม่สามารถย้อนกลับได้`)) return;
      button.disabled = true;
      try {
        await window.LoyKrathongDB.deleteWish(id);
        allWishes = allWishes.filter(wish => wish.id !== id);
        renderRows();
        pageStatus.className = "status";
        pageStatus.textContent = "ลบข้อมูลเรียบร้อยแล้ว";
      } catch (error) {
        console.error(error);
        pageStatus.className = "status error";
        pageStatus.textContent = "ลบข้อมูลไม่สำเร็จ: " + (error.message || "เกิดข้อผิดพลาด");
        button.disabled = false;
      }
    });

    document.getElementById("editForm").addEventListener("submit", async event => {
      event.preventDefault();
      const button = document.getElementById("saveEdit");
      const id = document.getElementById("editId").value;
      const data = {
        fullName:document.getElementById("editName").value,
        employeeCode:document.getElementById("editCode").value,
        department:document.getElementById("editDepartment").value,
        whName:document.getElementById("editWarehouse").value,
        krathongType:document.getElementById("editType").value,
        wish:document.getElementById("editWish").value
      };
      button.disabled = true;
      button.textContent = "กำลังบันทึก...";
      try {
        await window.LoyKrathongDB.updateWish(id,data);
        const index = allWishes.findIndex(item => item.id === id);
        if (index >= 0) allWishes[index] = {...allWishes[index],...data};
        renderRows();
        closeEditor();
        pageStatus.className = "status";
        pageStatus.textContent = "บันทึกการแก้ไขเรียบร้อยแล้ว";
      } catch (error) {
        console.error(error);
        pageStatus.className = "status error";
        pageStatus.textContent = "บันทึกไม่สำเร็จ: " + (error.message || "เกิดข้อผิดพลาด");
      } finally {
        button.disabled = false;
        button.textContent = "บันทึกการแก้ไข";
      }
    });

    searchInput.addEventListener("input",renderRows);
    document.getElementById("refreshButton").addEventListener("click",loadWishes);
    document.getElementById("closeModal").addEventListener("click",closeEditor);
    document.getElementById("cancelEdit").addEventListener("click",closeEditor);
    backdrop.addEventListener("click",event => { if (event.target === backdrop) closeEditor(); });
    document.addEventListener("keydown",event => { if (event.key === "Escape") closeEditor(); });
    loadWishes();
  </script>
</body>
</html>
