<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d19">
  <title>Loy Krathong</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500&family=Playfair+Display:wght@400;500&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="../style/style.css">
  <link rel="stylesheet" href="../style/wishes.css">
  <link rel="stylesheet" href="../style/typography.css">
</head>

<body>

  <nav class="top-nav">
    <a href="../index.html" class="nav-link" aria-current="page">หน้าหลัก</a>
    <a href="create.html" class="nav-link">สร้างกระทง</a>
    <a href="wishes.html" class="nav-link">คำอธิษฐาน</a>
  </nav>

  <canvas id="webgl-canvas"></canvas>

  <main class="landing">
    <div class="sky-lanterns" aria-hidden="true">
      <div class="sky-lantern-image sky-lantern-1"><img src="../images/obj04.png" alt="" loading="eager"></div>
      <div class="sky-lantern-image sky-lantern-2"><img src="../images/obj04.png" alt="" loading="eager"></div>
      <div class="sky-lantern-image sky-lantern-3"><img src="../images/obj04.png" alt="" loading="eager"></div>
      <div class="sky-lantern-image sky-lantern-4"><img src="../images/obj04.png" alt="" loading="eager"></div>
      <div class="sky-lantern-image sky-lantern-5"><img src="../images/obj04.png" alt="" loading="eager"></div>
      <div class="sky-lantern-image sky-lantern-6"><img src="../images/obj04.png" alt="" loading="eager"></div>
    </div>

    <div class="moon-glow"></div>
    <div class="water"></div>

    <section class="content">
      <p class="eyebrow">YOUR MOMENT</p>

      <header class="intro">
        <h1>คืนความสุข<br>ให้สายน้ำ</h1>
        <div class="ornament" aria-hidden="true">✧ ❈ ✧</div>
        <p class="description">
          บางความรู้สึกเหมาะกับการฝากไว้กับสายน้ำ<br>
          คำอธิษฐานของคุณจะถูกส่งไปกับกระทง<br>
        </p>
      </header>
    </section>

    <section aria-labelledby="wishes-title">
      <div class="toolbar">
        
        <span class="count" id="resultCount">กำลังโหลด...</span>
      </div>
      <section class="wish-grid" id="wishGrid" aria-live="polite" aria-label="กระทงคำอธิษฐาน">
        <div class="state-message">กำลังรวบรวมคำอธิษฐาน...</div>
      </section>
      <div class="refresh-row">
        <button class="refresh-btn" id="refreshWishes" type="button">↻ สุ่มคำอธิษฐานใหม่</button>
      </div>
    </section>

    <footer>
      <span>MADE WITH A WISH</span>
      <span>LOY KRATHONG · </span>
    </footer>


  </main>

  <script src="../js/wishes.js"></script>
</body>

</html>
